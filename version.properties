# Version series for the Trittbrett Laufbursche Edition, read by app/build.gradle and the CI release workflow.
# releaseCount = patch of the LAST PUBLISHED release (bumped by CI once per push, never by commits).
# Push to main = one release = releaseCount + 1.  Individual commits do NOT change this value.
#   versionName (release APK) = major.minor.(releaseCount + 1)       <- CI bumps then builds
#   versionName (debug build) = major.minor.(releaseCount + 1)-dev   <- local dev marker
#   versionCode               = codeBase + releaseCount + 1          <- increments once per release
# To start a new minor/major series: bump minor (or major), reset releaseCount to 0, and raise
# codeBase to (old_codeBase + old_releaseCount + 1) so versionCode never goes backwards.
# Migrated from the old per-commit scheme (versionName = major.minor.(git commit count - patchZeroAt),
# versionCode = CI workflow run number). The last release the old scheme published was v1.0.20 at
# versionCode 22, so releaseCount starts at 20 and codeBase at 2 (2 + 20 + 1 = 23 = next versionCode,
# one above the published 22).
major=1
minor=0
releaseCount=20
codeBase=2
